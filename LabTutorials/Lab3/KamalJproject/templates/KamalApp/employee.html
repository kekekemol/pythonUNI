<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information</title>
</head>
<body>
    <h1>Enter Employee Information</h1>

    <form method="post">
        {% csrf_token %}

        <label for="id">Employee ID:</label>
        <input type="number" id="id" name="id" required><br><br>

        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" required><br><br>

        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" required><br><br>

        <label for="salary">Salary:</label>
        <input type="number" id="salary" name="salary" step="0.01" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <button type="submit">Submit</button>
    </form>

    {% if employee %}
        <h2>Employee Saved</h2>
        <p><strong>ID:</strong> {{ employee.emp_id }}</p>
        <p><strong>Name:</strong> {{ employee.emp_firstName }} {{ employee.emp_lastName }}</p>
        <p><strong>Salary:</strong> ${{ employee.emp_salary }}</p>
        <p><strong>Email:</strong> {{ employee.emp_email }}</p>
    {% endif %}
</body>
</html>
